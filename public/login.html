<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 烬潮</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="navbar">
    <a class="nav-brand" href="/"><svg class="brand-logo" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3 1.072-2.143 2.5-3.736 4.5-5 .5 2.5 1.5 3.5 2.5 5a7.5 7.5 0 1 1-11 0c.383-.476 1-1.5 1-2.5"/></svg>烬潮</a>
    <div class="nav-center">
      <form class="nav-search" id="nav-search-form">
        <input class="nav-search-input" id="nav-search-input" type="search" placeholder="搜索视频 / 文章 / 文件" />
        <button class="nav-search-btn" type="submit">搜索</button>
      </form>
    </div>
    <div class="nav-actions" id="nav-actions"></div>
  </header>
  
  <main class="auth-page">
    <div class="auth-shell">
      <aside class="auth-visual" aria-hidden="true">
        <div class="auth-visual-glow"></div>
        <div class="auth-visual-inner">
          <span class="auth-visual-badge">烬潮 · 潮流视频社区</span>
          <h1 class="auth-visual-title">点燃你的<br>每一次创作</h1>
          <p class="auth-visual-desc">上传视频、发送弹幕、结识同好，这里是属于你的创作社区。</p>
          <ul class="auth-visual-points">
            <li>高清播放，HLS 自适应转码</li>
            <li>实时弹幕，与同好同屏互动</li>
            <li>关注、收藏、私信一站打通</li>
          </ul>
        </div>
      </aside>

      <section class="auth-form-panel">
        <div class="auth-card">
          <h2>登录</h2>
          <div class="auth-mode-switch" role="tablist" aria-label="登录方式">
            <button class="auth-mode-button is-active" type="button" data-login-mode="password">密码登录</button>
            <button class="auth-mode-button" type="button" data-login-mode="email">邮箱验证码登录</button>
          </div>
          <form id="login-form">
            <div class="form-group">
              <label for="email">邮箱</label>
              <input type="email" id="email" name="email" placeholder="请输入邮箱" required>
            </div>
            <div class="form-group" id="password-login-field">
              <label for="password">密码</label>
              <input type="password" id="password" name="password" placeholder="请输入密码" required>
            </div>
            <div class="form-group" id="email-login-field" hidden>
              <label for="login-code">邮箱验证码</label>
              <div class="input-with-button">
                <input type="text" id="login-code" name="code" placeholder="请输入验证码" maxlength="6">
                <button class="btn btn-secondary" id="send-login-code" type="button">发送验证码</button>
              </div>
            </div>
            <button type="submit" class="btn btn-primary auth-submit">登录</button>
          </form>
          <div class="auth-switch">
            <p>还没有账号？<a class="auth-switch-link" href="/register.html">立即注册<span class="auth-switch-arrow" aria-hidden="true">→</span></a></p>
          </div>
          <div id="login-message" class="message"></div>
        </div>
      </section>
    </div>
  </main>
  
  <script src="/js/app.js"></script>
  <script>
    updateNavigation();
    setupLoginModes();
    document.getElementById('send-login-code').addEventListener('click', sendLoginCode);
    document.getElementById('login-form').addEventListener('submit', handleLogin);
  </script>
</body>
</html>
