<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的投稿 - 烬潮</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="navbar">
    <a class="nav-brand" href="/"><svg class="brand-logo" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3 1.072-2.143 2.5-3.736 4.5-5 .5 2.5 1.5 3.5 2.5 5a7.5 7.5 0 1 1-11 0c.383-.476 1-1.5 1-2.5"/></svg>烬潮</a>
    <div class="nav-center">
      <form class="nav-search" id="nav-search-form">
        <input class="nav-search-input" id="nav-search-input" type="search" placeholder="搜索视频 / 文章 / 文件" />
        <button class="nav-search-btn" type="submit">搜索</button>
      </form>
    </div>
    <div class="nav-actions" id="nav-actions"></div>
  </header>
  <main class="container">
    <a class="back-link" href="/dashboard.html">返回我的</a>
    <section class="search-page-header">
      <p class="eyebrow">MY SUBMISSIONS</p>
      <h1>我的投稿</h1>
      <p>按文章、视频和文件分类管理你发布的内容。</p>
    </section>
    <section class="submission-category"><div class="section-heading"><h2>我的文章</h2><span id="my-post-count"></span></div><div id="my-submission-posts" class="posts-list"><p class="loading">加载中...</p></div></section>
    <section class="submission-category"><div class="section-heading"><h2>我的视频</h2><span id="my-video-count"></span></div><div id="my-submission-videos" class="videos-list"><p class="loading">加载中...</p></div></section>
    <section class="submission-category"><div class="section-heading"><h2>我的文件</h2><span id="my-file-count"></span></div><div id="my-submission-files" class="files-list"><p class="loading">加载中...</p></div></section>
  </main>
  <script src="/js/app.js"></script>
  <script>updateNavigation(); checkAuth(); setupDetailCards(); loadMySubmissions();</script>
</body>
</html>
