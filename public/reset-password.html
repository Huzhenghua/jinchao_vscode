<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>设置新密码 - 烬潮</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="navbar">
    <a class="nav-brand" href="/"><svg class="brand-logo" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3 1.072-2.143 2.5-3.736 4.5-5 .5 2.5 1.5 3.5 2.5 5a7.5 7.5 0 1 1-11 0c.383-.476 1-1.5 1-2.5"/></svg>烬潮</a>
    <div class="nav-center">
      <form class="nav-search" id="nav-search-form">
        <input class="nav-search-input" id="nav-search-input" type="search" placeholder="搜索视频 / 文章 / 文件" />
        <button class="nav-search-btn" type="submit">搜索</button>
      </form>
    </div>
    <div class="nav-actions" id="nav-actions"></div>
  </header>

  <main class="auth-page">
    <div class="auth-shell">
      <aside class="auth-visual" aria-hidden="true">
        <div class="auth-visual-glow"></div>
        <div class="auth-visual-inner">
          <span class="auth-visual-badge">烬潮 · 账号安全</span>
          <h1 class="auth-visual-title">设置一个<br>新的密码</h1>
          <p class="auth-visual-desc">为了账号安全，修改成功后所有设备都需要用新密码重新登录。</p>
        </div>
      </aside>

      <section class="auth-form-panel">
        <div class="auth-card">
          <h2>设置新密码</h2>
          <p class="auth-hint" id="reset-account" hidden></p>
          <form id="reset-form" hidden>
            <div class="form-group">
              <label for="password">新密码</label>
              <input type="password" id="password" name="password" placeholder="至少 8 位字符" minlength="8" required>
            </div>
            <div class="form-group">
              <label for="confirm-password">确认新密码</label>
              <input type="password" id="confirm-password" name="confirm-password" placeholder="请再次输入新密码" minlength="8" required>
            </div>
            <button type="submit" class="btn btn-primary auth-submit">确认修改</button>
          </form>
          <div class="auth-switch">
            <p><a class="auth-switch-link" href="/forgot-password.html">重新发送验证链接</a> · <a class="auth-switch-link" href="/login.html">返回登录</a></p>
          </div>
          <div id="reset-message" class="message is-visible">正在校验链接…</div>
        </div>
      </section>
    </div>
  </main>

  <script src="/js/app.js"></script>
  <script>
    updateNavigation();
    initResetPasswordPage();
    document.getElementById('reset-form').addEventListener('submit', handleConfirmResetPassword);
  </script>
</body>
</html>
