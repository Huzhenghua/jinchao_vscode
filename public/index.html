<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>烬潮 - B站风格视频网站</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="navbar">
    <a class="nav-brand" href="/"><svg class="brand-logo" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3 1.072-2.143 2.5-3.736 4.5-5 .5 2.5 1.5 3.5 2.5 5a7.5 7.5 0 1 1-11 0c.383-.476 1-1.5 1-2.5"/></svg>烬潮</a>
    <div class="nav-center">
      <form class="nav-search" id="nav-search-form">
        <input class="nav-search-input" id="nav-search-input" type="search" placeholder="搜索视频 / 文章 / 文件" />
        <button class="nav-search-btn" type="submit">搜索</button>
      </form>
    </div>
    <div class="nav-actions" id="nav-actions"></div>
  </header>

  <main class="container">

    <!-- ========== Hero 横幅 ========== -->
    <section class="hero-banner">
      <div class="hero-content">
        <h1 class="hero-title">烬潮 · 看视频、追动态、发弹幕</h1>
        <p class="hero-subtitle">视频、文章、文件一站直达，弹幕齐飞不孤单——和同好一起，把热爱追到底。</p>
        <div class="hero-actions">
          <a class="hero-btn hero-btn-primary" href="/browse.html?type=video">开始观看</a>
          <a class="hero-btn hero-btn-outline" href="/dashboard.html">发布作品</a>
        </div>
      </div>
    </section>

    <!-- ========== 分区Tab切换区 ========== -->
    <div id="category-tabs" class="category-tabs">
      <button class="category-tab active" data-category="">全部</button>
    </div>

    <!-- ========== 视频推荐流 (第一屏) ========== -->
    <section class="videos-section">
      <div class="section-header"><h2>视频推荐</h2><a class="more-link" href="/browse.html?type=video">更多 →</a></div>
      <div id="videos-list" class="video-grid videos-list">
        <div class="skeleton-card"><div class="skeleton skeleton-cover"></div><div class="skeleton skeleton-title"></div><div class="skeleton skeleton-up"></div></div>
        <div class="skeleton-card"><div class="skeleton skeleton-cover"></div><div class="skeleton skeleton-title"></div><div class="skeleton skeleton-up"></div></div>
        <div class="skeleton-card"><div class="skeleton skeleton-cover"></div><div class="skeleton skeleton-title"></div><div class="skeleton skeleton-up"></div></div>
        <div class="skeleton-card"><div class="skeleton skeleton-cover"></div><div class="skeleton skeleton-title"></div><div class="skeleton skeleton-up"></div></div>
        <div class="skeleton-card"><div class="skeleton skeleton-cover"></div><div class="skeleton skeleton-title"></div><div class="skeleton skeleton-up"></div></div>
        <div class="skeleton-card"><div class="skeleton skeleton-cover"></div><div class="skeleton skeleton-title"></div><div class="skeleton skeleton-up"></div></div>
      </div>
    </section>

    <!-- ========== 文章区域 (可折叠) ========== -->
    <section class="collapse-section">
      <div class="collapse-header" onclick="toggleCollapse(this)">
        <div class="section-header"><h2>最新文章</h2><a class="more-link" href="/browse.html?type=post" target="_blank" rel="noopener">更多 →</a></div>
        <span class="arrow" aria-hidden="true">▼</span>
      </div>
      <div class="collapse-body">
        <div id="posts-list" class="posts-list">
          <div class="skeleton-row"><div class="skeleton skeleton-title"></div><div class="skeleton skeleton-meta"></div><div class="skeleton skeleton-line"></div></div>
          <div class="skeleton-row"><div class="skeleton skeleton-title"></div><div class="skeleton skeleton-meta"></div><div class="skeleton skeleton-line"></div></div>
          <div class="skeleton-row"><div class="skeleton skeleton-title"></div><div class="skeleton skeleton-meta"></div><div class="skeleton skeleton-line"></div></div>
          <div class="skeleton-row"><div class="skeleton skeleton-title"></div><div class="skeleton skeleton-meta"></div><div class="skeleton skeleton-line"></div></div>
        </div>
      </div>
    </section>

    <!-- ========== 热门文件展示区：一次上传 = 一张卡片 ========== -->
    <section class="hot-files-section" aria-labelledby="hot-files-title">
      <div class="section-header">
        <h2 id="hot-files-title">热门文件</h2>
        <span class="hot-files-hint" id="hot-files-hint" tabindex="0"
          title="热度 = 下载量×3 + 收藏数×5 + 浏览量×1；热度相同时，最新上传的文件排在最前"
          aria-label="排序规则：文件按热度降序排列，热度等于下载量乘三加收藏数乘五加浏览量乘一；热度相同时，最新上传的文件排在最前">排序规则 ⓘ</span>
        <a class="more-link" href="/browse.html?type=file">更多 →</a>
      </div>

      <!-- 卡片网格：首屏先铺骨架屏，命中会话缓存时直接秒开 -->
      <div id="file-batch-list" class="file-batch-list" aria-busy="true" aria-describedby="hot-files-hint">
        <div class="skeleton-card file-batch-skeleton" aria-hidden="true"><div class="skeleton skeleton-title"></div><div class="skeleton file-batch-skeleton-grid"></div><div class="skeleton skeleton-line"></div></div>
        <div class="skeleton-card file-batch-skeleton" aria-hidden="true"><div class="skeleton skeleton-title"></div><div class="skeleton file-batch-skeleton-grid"></div><div class="skeleton skeleton-line"></div></div>
        <div class="skeleton-card file-batch-skeleton" aria-hidden="true"><div class="skeleton skeleton-title"></div><div class="skeleton file-batch-skeleton-grid"></div><div class="skeleton skeleton-line"></div></div>
        <div class="skeleton-card file-batch-skeleton" aria-hidden="true"><div class="skeleton skeleton-title"></div><div class="skeleton file-batch-skeleton-grid"></div><div class="skeleton skeleton-line"></div></div>
      </div>

      <!-- 滚动到此按钮即自动加载下一页；不支持 IntersectionObserver 时可手动点击 -->
      <button id="file-batch-sentinel" class="load-more-sentinel" type="button" hidden>加载更多</button>
      <button id="file-batch-retry" class="btn btn-secondary load-more-retry" type="button" hidden>加载失败，点击重试</button>
      <p id="file-batch-status" class="dash-visually-hidden" role="status" aria-live="polite"></p>
    </section>

  </main>

  <!-- 图片灯箱：点缩略图看原图，支持切换 / 缩放 / 下载 -->
  <div class="file-lightbox" id="file-lightbox" role="dialog" aria-modal="true" aria-label="图片预览" hidden>
    <button class="file-lightbox-close" type="button" aria-label="关闭预览">✕</button>
    <button class="file-lightbox-nav file-lightbox-prev" type="button" aria-label="上一张图片">‹</button>
    <button class="file-lightbox-nav file-lightbox-next" type="button" aria-label="下一张图片">›</button>
    <figure class="file-lightbox-figure">
      <img class="file-lightbox-image" src="" alt="">
      <figcaption class="file-lightbox-caption"></figcaption>
    </figure>
    <div class="file-lightbox-toolbar">
      <span class="file-lightbox-counter" hidden></span>
      <button class="file-lightbox-zoom-out" type="button" aria-label="缩小">−</button>
      <button class="file-lightbox-zoom-reset" type="button" aria-label="还原为原始大小">1:1</button>
      <button class="file-lightbox-zoom-in" type="button" aria-label="放大">＋</button>
      <a class="file-lightbox-download" href="" download hidden>下载原图</a>
    </div>
  </div>

  <!-- ========== 底部脚本区 ========== -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
  <script src="/js/file-card-logic.js"></script>
  <script src="/js/app.js"></script>
  <script>
    updateNavigation();
    setupDetailCards();
    loadCategoriesAndTabs(); // 加载分区Tab动态按钮
    const homeLimit = getHomeLimit();
    loadPosts('posts-list', homeLimit, 'hot');

    // 首页视频推荐流(全局渲染到 #videos-list)
    loadRecommendVideos();

    // 热门文件：一次上传聚合成一张卡片（图片九宫格 / 音频播放器 / 其他文件），按热度降序
    setupFileBatches();
    renderFileBatches();
    setupGlobalSearch();
  </script>
</body>
</html>
