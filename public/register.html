<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册 - 烬潮</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand">🔥 烬潮</div>
    <div class="nav-links">
      <a href="/">首页</a>
      <a class="btn btn-nav btn-nav-active" href="/register.html">注册</a>
      <a class="btn btn-nav" href="/login.html">登录</a>
    </div>
  </nav>
  
  <main class="container">
    <div class="auth-card">
      <h2>注册</h2>
      <form id="register-form">
        <div class="form-group">
          <label for="username">用户名</label>
          <input type="text" id="username" name="username" placeholder="请输入用户名" required>
        </div>
        <div class="form-group">
          <label for="email">邮箱</label>
          <div class="input-with-button">
            <input type="email" id="email" name="email" placeholder="请输入邮箱" required>
            <button type="button" class="btn btn-secondary" id="send-register-code" onclick="sendVerificationCode()">发送验证码</button>
          </div>
        </div>
        <div class="form-group">
          <label for="code">验证码</label>
          <input type="text" id="code" name="code" placeholder="请输入验证码" required>
        </div>
        <div class="form-group">
          <label for="password">密码</label>
          <input type="password" id="password" name="password" placeholder="请输入密码" required>
        </div>
        <div class="form-group">
          <label for="confirm-password">确认密码</label>
          <input type="password" id="confirm-password" name="confirm-password" placeholder="请再次输入密码" required>
        </div>
        <button type="submit" class="btn btn-primary">注册</button>
      </form>
      <div class="auth-links">
        <p>已有账号？<a href="/login.html">立即登录</a></p>
      </div>
      <div id="register-message" class="message"></div>
    </div>
  </main>
  
  <script src="/js/app.js"></script>
  <script>
    document.getElementById('register-form').addEventListener('submit', handleRegister);
  </script>
</body>
</html>
