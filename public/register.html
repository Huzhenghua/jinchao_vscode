<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册 - 烬潮</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="navbar">
    <a class="nav-brand" href="/"><svg class="brand-logo" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3 1.072-2.143 2.5-3.736 4.5-5 .5 2.5 1.5 3.5 2.5 5a7.5 7.5 0 1 1-11 0c.383-.476 1-1.5 1-2.5"/></svg>烬潮</a>
    <div class="nav-center">
      <form class="nav-search" id="nav-search-form">
        <input class="nav-search-input" id="nav-search-input" type="search" placeholder="搜索视频 / 文章 / 文件" />
        <button class="nav-search-btn" type="submit">搜索</button>
      </form>
    </div>
    <div class="nav-actions" id="nav-actions"></div>
  </header>
  
  <main class="auth-page">
    <div class="auth-shell">
      <aside class="auth-visual auth-visual-register" aria-hidden="true">
        <div class="auth-visual-glow"></div>
        <div class="auth-visual-inner">
          <span class="auth-visual-badge">烬潮 · 潮流视频社区</span>
          <h1 class="auth-visual-title">加入烬潮<br>开启创作之旅</h1>
          <p class="auth-visual-desc">注册只需一个邮箱，即刻解锁投稿、弹幕与社区互动。</p>
          <ul class="auth-visual-points">
            <li>免费投稿视频与文章</li>
            <li>专属个人空间与粉丝互动</li>
            <li>收藏、历史、消息云端同步</li>
          </ul>
        </div>
      </aside>

      <section class="auth-form-panel">
        <div class="auth-card">
          <h2>注册</h2>
          <form id="register-form">
            <div class="form-group">
              <label for="username">用户名</label>
              <input type="text" id="username" name="username" placeholder="请输入用户名" required>
            </div>
            <div class="form-group">
              <label for="email">邮箱</label>
              <div class="input-with-button">
                <input type="email" id="email" name="email" placeholder="请输入邮箱" required>
                <button type="button" class="btn btn-secondary" id="send-register-code" onclick="sendVerificationCode()">发送验证码</button>
              </div>
            </div>
            <div class="form-group">
              <label for="code">验证码</label>
              <input type="text" id="code" name="code" placeholder="请输入验证码" required>
            </div>
            <div class="form-group">
              <label for="password">密码</label>
              <input type="password" id="password" name="password" placeholder="请输入密码" required>
            </div>
            <div class="form-group">
              <label for="confirm-password">确认密码</label>
              <input type="password" id="confirm-password" name="confirm-password" placeholder="请再次输入密码" required>
            </div>
            <button type="submit" class="btn btn-primary auth-submit">注册</button>
          </form>
          <div class="auth-switch">
            <p>已有账号？<a class="auth-switch-link" href="/login.html">立即登录<span class="auth-switch-arrow" aria-hidden="true">→</span></a></p>
          </div>
          <div id="register-message" class="message"></div>
        </div>
      </section>
    </div>
  </main>
  
  <script src="/js/app.js"></script>
  <script>
    updateNavigation();
    document.getElementById('register-form').addEventListener('submit', handleRegister);
  </script>
</body>
</html>
