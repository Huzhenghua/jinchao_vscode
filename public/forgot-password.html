<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>忘记密码 - 烬潮</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="navbar">
    <a class="nav-brand" href="/"><svg class="brand-logo" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3 1.072-2.143 2.5-3.736 4.5-5 .5 2.5 1.5 3.5 2.5 5a7.5 7.5 0 1 1-11 0c.383-.476 1-1.5 1-2.5"/></svg>烬潮</a>
    <div class="nav-center">
      <form class="nav-search" id="nav-search-form">
        <input class="nav-search-input" id="nav-search-input" type="search" placeholder="搜索视频 / 文章 / 文件" />
        <button class="nav-search-btn" type="submit">搜索</button>
      </form>
    </div>
    <div class="nav-actions" id="nav-actions"></div>
  </header>

  <main class="auth-page">
    <div class="auth-shell">
      <aside class="auth-visual" aria-hidden="true">
        <div class="auth-visual-glow"></div>
        <div class="auth-visual-inner">
          <span class="auth-visual-badge">烬潮 · 账号安全</span>
          <h1 class="auth-visual-title">找回你的<br>账号访问</h1>
          <p class="auth-visual-desc">输入注册邮箱，我们会给你发送一封带有验证链接的邮件。</p>
          <ul class="auth-visual-points">
            <li>链接 30 分钟内有效</li>
            <li>链接只能使用一次</li>
            <li>修改成功后你会收到通知邮件</li>
          </ul>
        </div>
      </aside>

      <section class="auth-form-panel">
        <div class="auth-card">
          <h2>忘记密码</h2>
          <p class="auth-hint">请输入你的注册邮箱，我们将发送密码修改链接。</p>
          <form id="forgot-form">
            <div class="form-group">
              <label for="email">注册邮箱</label>
              <input type="email" id="email" name="email" placeholder="请输入注册邮箱" required>
            </div>
            <button type="submit" class="btn btn-primary auth-submit">发送验证链接</button>
          </form>
          <div class="auth-switch">
            <p>想起密码了？<a class="auth-switch-link" href="/login.html">返回登录<span class="auth-switch-arrow" aria-hidden="true">→</span></a></p>
          </div>
          <div id="forgot-message" class="message"></div>
        </div>
      </section>
    </div>
  </main>

  <script src="/js/app.js"></script>
  <script>
    updateNavigation();
    document.getElementById('forgot-form').addEventListener('submit', handleForgotPassword);
  </script>
</body>
</html>
