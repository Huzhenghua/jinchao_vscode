<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>站内搜索 - 烬潮</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand">🔥 烬潮</div>
    <div class="nav-links">
      <a href="/">首页</a>
      <form id="global-search-form" class="search-form">
        <input id="global-search-input" type="search" placeholder="搜索文章 / 视频 / 文件" aria-label="站内搜索">
        <button type="submit" class="btn btn-secondary">搜索</button>
      </form>
      <span class="auth-links">
        <a class="btn btn-nav" href="/register.html">注册</a>
        <a class="btn btn-nav btn-nav-active" href="/login.html">登录</a>
      </span>
    </div>
  </nav>

  <main class="container">
    <section class="search-page-header">
      <p class="eyebrow">SITE SEARCH</p>
      <h1>搜索结果</h1>
      <p>文章、视频和文件已经分开整理，查找内容更清晰。</p>
      <label class="browse-sort-label">排序 <select id="search-sort"><option value="hot">热度优先</option><option value="latest">最新发布</option></select></label>
    </section>

    <div id="search-results" class="search-results">
      <p class="loading">正在搜索...</p>
    </div>
  </main>

  <script src="/js/app.js"></script>
  <script>
    updateNavigation();
    setupGlobalSearch();
    setupDetailCards();
    loadSearchResults();
  </script>
</body>
</html>
